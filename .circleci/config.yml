# Javascript Node CircleCI 2.0 configuration file
#
# Check https://circleci.com/docs/2.0/language-javascript/ for more details
#
version: 2
defaults: &defaults
  docker:
    - image: circleci/node:8.11.3
  working_directory: ~/repo
jobs:
  build:
    <<: &defaults
    steps:
      - checkout

      # Download and cache dependencies
      - restore_cache:
          keys:
          - v1-dependencies-{{ checksum "package.json" }}
          # fallback to using the latest cache if no exact match is found
          - v1-dependencies-

      - run: npm install

      - save_cache:
          paths:
            - node_modules
          key: v1-dependencies-{{ checksum "package.json" }}

      # run tests!
      - run: npm run test

      - run: npm run codecov
  test:
    <<: &defaults
    steps:
      - checkout
      # Download and cache dependencies
      - restore_cache:
          keys:
          - v1-dependencies-{{ checksum "package.json" }}
          # fallback to using the latest cache if no exact match is found
          - v1-dependencies-
      - run: npm run test
      - run: npm run codecov
  storybook:
    <<: &defaults
      steps:
        - run: npm run storybook:build
        - store_artifacts:
            path: artifacts/static
workflows:
  version: 2
  build_and_test:
    jobs:
      - build
      - test
        requires:
          - build
      - storybook
        requires
          - build





